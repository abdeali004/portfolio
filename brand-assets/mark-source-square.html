<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  /* Abdeali Stationwala — developer brand mark, 512x512 opaque chip.
     Screenshot with a transparent default background so the rounded
     corners stay transparent:
       chrome --headless --screenshot=mark-512-raw.png --window-size=512,512
              --force-device-scale-factor=2 --default-background-color=00000000
              mark-source-square.html
     (2x scale factor => 1024x1024 raw render, downscaled to 512 for crispness) */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 512px; height: 512px; background: transparent; }
  .mark {
    width: 512px; height: 512px; border-radius: 108px;
    background: linear-gradient(140deg, #b3728a 0%, #704559 52%, #2a0f1c 100%);
    position: relative;
    box-shadow: 0 14px 34px rgba(69, 26, 45, 0.45);
  }
  svg { position: absolute; inset: 0; margin: auto; }
</style>
</head>
<body>
  <div class="mark">
    <svg width="320" height="320" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- code angle-brackets flanking an accent slash: universal "developer" glyph -->
      <path d="M38 26 L12 50 L38 74" stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M62 26 L88 50 L62 74" stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="58" y1="20" x2="42" y2="80" stroke="#e8b84b" stroke-width="7" stroke-linecap="round"/>
    </svg>
  </div>
</body>
</html>
